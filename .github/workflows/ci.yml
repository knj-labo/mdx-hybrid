name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: crates/napi/pnpm-lock.yaml

      - name: Validate backlog specs
        run: node scripts/check-backlog.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run rust tests
        run: cargo test --workspace

      - name: Install dependencies
        working-directory: crates/napi
        run: pnpm install --frozen-lockfile

      - name: Build NAPI binding
        working-directory: crates/napi
        run: pnpm run build:napi

      - name: Smoke test NAPI binding
        working-directory: crates/napi
        run: pnpm run smoke:napi -- samples/large.md

      - name: Install Astro harness dependencies
        working-directory: fixtures/integration/astro-harness
        run: pnpm install --frozen-lockfile

      - name: Compare Astro harness (markflow vs baseline)
        run: node scripts/compare-astro-harness.mjs --runs=2 --summary harness-summary.json

      - name: Publish Astro harness summary
        run: |
          node <<'NODE'
          const fs = require('fs')
          const summary = JSON.parse(fs.readFileSync('harness-summary.json', 'utf8'))
          const formatRow = (label, stats) => `| ${label} | ${stats.avg.toFixed(2)} | ${stats.min.toFixed(2)} | ${stats.max.toFixed(2)} |`
          const lines = [
            '### Astro Harness Comparison',
            '',
            `Runs: ${summary.runs}`,
            '',
            '| Mode | Avg (ms) | Min (ms) | Max (ms) |',
            '| --- | --- | --- | --- |',
            formatRow('Markflow', summary.markflow),
            formatRow('Baseline', summary.baseline),
            '',
            `Speedup (baseline / markflow): ${summary.speedup.toFixed(2)}x`,
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          NODE
