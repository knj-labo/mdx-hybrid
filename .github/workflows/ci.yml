name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      harness:
        description: "Run astro harness comparison (baseline vs markflow)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: crates/napi/pnpm-lock.yaml


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run rust tests
        run: cargo test --workspace

      - name: Install dependencies
        working-directory: crates/napi
        run: pnpm install --frozen-lockfile

      - name: Build NAPI binding
        working-directory: crates/napi
        run: pnpm run build:napi

      - name: Smoke test NAPI binding
        working-directory: crates/napi
        run: pnpm run smoke:napi -- fixtures/core/markdown/hello.md

  astro-harness:
    name: Astro harness (opt-in)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.harness == 'true' || github.event.inputs.harness == '1')) ||
      (github.event_name == 'pull_request' && contains(toJson(github.event.pull_request.labels.*.name), 'perf'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: |
            crates/napi/pnpm-lock.yaml
            fixtures/integration/astro-harness/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install NAPI deps
        working-directory: crates/napi
        run: pnpm install --frozen-lockfile

      - name: Build NAPI binding
        working-directory: crates/napi
        run: pnpm run build:napi

      - name: Install harness deps
        working-directory: fixtures/integration/astro-harness
        run: pnpm install --frozen-lockfile

      - name: Run harness comparison
        run: node scripts/compare-astro-harness.mjs --summary fixtures/integration/astro-harness/harness-summary.json
