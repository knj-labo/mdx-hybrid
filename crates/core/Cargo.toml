[package]
name = "markflow-core"
description = "Markflow parser + PipeAdapter + streaming rewriter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lol_html = "2.0"
thiserror = "2.0.17"
markdown = "1.0.0-alpha.16"
log = "0.4"
html-escape = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
insta = { version = "1.39.0", features = ["yaml"] }
once_cell = "1.19"

[package.metadata.insta]
review = false
snapshot-path = "tests/snapshots"
